name: Import git bundle

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/import-bundle.yml"

jobs:
  import:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Import tree from bundle
        env:
          BUNDLE_URL: https://eldev.website/_tmp/eldev-full.bundle
        run: |
          set -euxo pipefail
          curl -fsSL -o /tmp/eldev.bundle "$BUNDLE_URL"
          ls -lh /tmp/eldev.bundle
          git bundle verify /tmp/eldev.bundle
          rm -rf /tmp/eldev-src
          git clone /tmp/eldev.bundle /tmp/eldev-src
          # Keep all existing workflows (GITHUB_TOKEN cannot modify workflow files)
          rm -rf /tmp/keep-github
          mkdir -p /tmp/keep-github
          if [ -d .github ]; then cp -a .github /tmp/keep-github/; fi
          find . -mindepth 1 -maxdepth 1 ! -name '.git' -exec rm -rf {} +
          shopt -s dotglob nullglob
          cp -a /tmp/eldev-src/* .
          mkdir -p .github
          if [ -d /tmp/keep-github/.github ]; then cp -a /tmp/keep-github/.github/. .github/; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          # Unstage any workflow changes so push is allowed with GITHUB_TOKEN
          git restore --staged .github/workflows 2>/dev/null || true
          git checkout -- .github/workflows 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Import full ELDEV site from git bundle"
          git push origin HEAD:main
