name: Import git bundle

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/import-bundle.yml"

jobs:
  import:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Import tree from bundle
        env:
          BUNDLE_URL: https://eldev.website/_tmp/eldev-full.bundle
        run: |
          set -euxo pipefail
          curl -fsSL -o /tmp/eldev.bundle "$BUNDLE_URL"
          git bundle verify /tmp/eldev.bundle
          rm -rf /tmp/eldev-src
          git clone --branch main /tmp/eldev.bundle /tmp/eldev-src
          echo "bundle_files=$(find /tmp/eldev-src -type f ! -path '*/.git/*' | wc -l)" | tee /tmp/import-debug.txt
          test -f /tmp/eldev-src/admin/admin.js
          test -f /tmp/eldev-src/server/index.mjs
          rm -rf /tmp/keep-github
          cp -a .github /tmp/keep-github
          find . -mindepth 1 -maxdepth 1 ! -name '.git' -exec rm -rf {} +
          # Copy without relying on shell globbing
          cp -a /tmp/eldev-src/. .
          rm -rf .git
          mv /tmp/keep-github-git .git 2>/dev/null || true
          # Restore the original .git from checkout - ABOVE wiped it if we copied .git from src!
