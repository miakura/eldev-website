name: Import git bundle

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/import-trigger"

jobs:
  import:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Import tree from bundle
        env:
          BUNDLE_URL: https://eldev.website/eldev.bundle
        run: |
          set -euxo pipefail
          curl -fsSL -o /tmp/eldev.bundle "$BUNDLE_URL"
          git bundle verify /tmp/eldev.bundle
          rm -rf /tmp/eldev-src
          git clone --branch main /tmp/eldev.bundle /tmp/eldev-src
          cp -a .github /tmp/keep-github
          find . -mindepth 1 -maxdepth 1 ! -name '.git' -exec rm -rf {} +
          rsync -a --delete --exclude '.git' --exclude '.github/workflows' /tmp/eldev-src/ ./
          mkdir -p .github
          rsync -a /tmp/keep-github/ .github/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git restore --staged .github/workflows || true
          git checkout -- .github/workflows || true
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Import full ELDEV site from git bundle (eba6432)"
          git push origin HEAD:main
